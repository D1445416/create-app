{% extends "base.html" %}

{% block title %}台中大眾運輸交通整合系統 - 使用者登入{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-5">
        <div class="glass-card p-4 p-md-5 position-relative overflow-hidden">
            <!-- Glow decorative -->
            <div class="position-absolute top-0 start-100 translate-middle rounded-circle bg-primary opacity-10" style="width: 150px; height: 150px; filter: blur(40px);"></div>
            
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-lock text-accent fs-4"></i>
                </div>
                <h3 class="text-accent-gradient">登入您的 TransitGO 帳號</h3>
                <p class="text-muted small">開始存取您的個人化常用路線與搜尋歷史紀錄</p>
            </div>

            <form action="{{ url_for('auth.login') }}" method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label text-light small font-semibold">使用者帳號 (Username)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-glass border-glass-subtle text-muted"><i class="fa-regular fa-user"></i></span>
                        <input type="text" class="form-control form-control-premium" id="username" name="username" placeholder="請輸入帳號" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-light small font-semibold">密碼 (Password)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-glass border-glass-subtle text-muted"><i class="fa-solid fa-key"></i></span>
                        <input type="password" class="form-control form-control-premium" id="password" name="password" placeholder="請輸入密碼" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-accent py-2.5 rounded-pill font-semibold">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> 登入帳號
                    </button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-glass-subtle">
                <span class="text-muted small">還沒有帳號嗎？</span>
                <a href="{{ url_for('auth.register') }}" class="text-accent small font-semibold ms-1 text-decoration-none">立即註冊</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
